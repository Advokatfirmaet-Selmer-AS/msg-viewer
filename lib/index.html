<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Free in-browser .msg viewer</title>
    <meta charset="UTF-8">
    <meta name="description" content="Read .msg file in your browser for free without sending any data to an external server.">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="icon" href="./favicon.ico">
  </head>
  <body>
    <div id="root">
      <aside id="sidebar" class="flex-col">
        <div class="sidebar-header">
          <label for="file" class="btn sidebar-add-btn">Add .msg files</label>
          <input type="file" id="file" name="file" accept=".msg" multiple hidden />
        </div>

        <ul id="sidebar-list" class="sidebar-list hidden"></ul>

        <div id="info" class="flex-col">
          <div class="flex-col info-content">
            <h1>.msg viewer</h1>
            <p>This tool allows you to easily view the content of the Outlook .msg file.</p>
            <ul>
              <li>Free</li>
              <li>In browser</li>
              <li>Fast</li>
              <li>Secure</li>
              <li>No server</li>
              <li>No data sharing</li>
            </ul>
          </div>
          <div class="info-footer">
            <div>Source code can be found on&nbsp;<a class="footer-link" href="https://github.com/molotochok/msg-viewer">Github</a></div>
          </div>
        </div>
      </aside>

      <div id="msg"></div>
    </div>

    <script type="module" src="./scripts/index.ts"></script>
  </body>
</html>
